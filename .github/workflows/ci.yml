name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs are cancelled only on pull requests, so main's status badge never shows "cancelled".
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Engine (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - name: Lint and format check (Biome)
        run: npx biome ci .
      - name: Tests
        run: npm test

  app:
    name: macOS app
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Format check (swift-format)
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Lint (SwiftLint)
        run: |
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          swiftlint --strict
      - name: Build
        run: swift build
      - name: Test
        run: swift test
